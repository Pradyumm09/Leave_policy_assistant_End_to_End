services:

  # =======================================================
  # BACKEND
  # =======================================================

  backend:

    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: leave-policy-backend

    env_file:
      - .env

    ports:
      - "8000:8000"

    volumes:
      - huggingface_cache:/root/.cache/huggingface

    restart: unless-stopped


  # =======================================================
  # FRONTEND
  # =======================================================

  frontend:

    build:
      context: .
      dockerfile: Dockerfile.frontend

    container_name: leave-policy-frontend

    environment:
      BACKEND_URL: http://backend:8000

    ports:
      - "8501:8501"

    depends_on:
      - backend

    restart: unless-stopped


# =========================================================
# VOLUMES
# =========================================================

volumes:

  huggingface_cache: